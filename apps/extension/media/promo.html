<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Better Passwords promotional art</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f3;color:#142324}.tile{position:relative;width:100%;height:100%;overflow:hidden}.brand{display:flex;align-items:center;font-weight:650;letter-spacing:-.6px}.brand img{width:44px;height:44px;margin-right:12px}h1{font-weight:660;letter-spacing:-2.6px;line-height:1.04;margin:0}.sub{color:#52665e;line-height:1.5}.footer{position:absolute;color:#61716e}.pill{display:inline-block;background:#e0ede4;color:#126955;border:1px solid #cbded0;border-radius:30px;font-size:14px;font-weight:600;padding:8px 14px}.copy{position:relative;z-index:2}.art{position:absolute;background:#e2eee5;border-radius:50%}.screen{position:absolute;width:870px;height:auto;border-radius:18px;border:1px solid #d5e0d7;box-shadow:0 24px 70px #244c3624}.small .copy{padding:24px 28px}.small .brand{font-size:23px}.small .brand img{width:42px;height:42px;margin-right:10px}.small h1{font-size:38px;letter-spacing:-1.7px;margin-top:23px}.small .sub{font-size:14px;margin-top:14px}.small .footer{bottom:16px;left:28px;font-size:10px}.small .art{width:280px;height:280px;right:-160px;bottom:-145px}.marquee .copy{padding:44px 54px;width:600px}.marquee .brand{font-size:27px}.marquee h1{font-size:65px;margin-top:56px}.marquee .sub{font-size:20px;margin-top:22px}.marquee .pill{margin-top:24px}.marquee .footer{bottom:25px;left:54px;font-size:12px}.marquee .art{width:880px;height:880px;left:650px;top:-150px}.marquee .shot{position:absolute;left:780px;top:85px;width:520px;height:390px;overflow:hidden;border-radius:18px;border:1px solid #d5e0d7;box-shadow:0 24px 70px #244c3624}.marquee .screen{left:-132px;top:-245px;width:1150px;border:0;border-radius:0;box-shadow:none}.marquee .screen-caption{position:absolute;bottom:25px;right:42px;font-size:12px;color:#61716e}
</style>
<div class="tile"><div class="art"></div><div class="copy"><div class="brand"><img src="/icon.svg" alt="">Better Passwords</div><h1>Apple Passwords.<br>In your browser.</h1><div class="sub">Autofill, generate and save passwords.</div><div class="pill">For Mac · Free &amp; open source</div></div><div class="shot"><img class="screen" src="/screenshot.png" alt="Real extension UI on a demo website"></div><div class="footer">Not affiliated with Apple Inc.</div><div class="screen-caption">Demo website · Sample credentials</div></div>
<script>const small=innerWidth<500;document.body.className=small?'small':'marquee';if(small){document.querySelector('.screen').remove();document.querySelector('.screen-caption').remove();document.querySelector('.pill').remove();document.querySelector('.sub').textContent='For Mac · Free & open source'}</script>
</html>
