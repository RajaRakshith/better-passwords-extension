<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test sign-up</title>
    <style>
      body { font: 16px system-ui; padding: 40px; }
      input { display: block; margin: 8px 0 16px; padding: 6px; width: 260px; }
    </style>
  </head>
  <body>
    <form id="signup">
      <label>Email <input id="email" type="email" autocomplete="email" /></label>
      <label>Password <input id="new" type="password" autocomplete="new-password" /></label>
      <label>Confirm password <input id="confirm" type="password" autocomplete="new-password" /></label>
      <button type="submit">Create account</button>
    </form>
    <script>
      document.getElementById("signup").addEventListener("submit", (event) => event.preventDefault());
    </script>
  </body>
</html>
