<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test login</title>
    <style>
      body { font: 16px system-ui; padding: 40px; }
      input { display: block; margin: 8px 0 16px; padding: 6px; width: 260px; }
    </style>
  </head>
  <body>
    <form id="login">
      <label>Email <input id="user" type="email" autocomplete="username" /></label>
      <label>Password <input id="pass" type="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <form id="newsletter">
      <label>Newsletter <input id="newsletter-email" type="email" /></label>
    </form>
  </body>
</html>
